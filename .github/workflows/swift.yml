name: Swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve simulator destination
        id: sim
        run: |
          # Pick the latest available iPhone simulator runtime
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
              if 'iOS' in runtime:
                  for d in data['devices'][runtime]:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(f\"platform=iOS Simulator,id={d['udid']}\")
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "destination=${DEST}" >> "${GITHUB_OUTPUT}"
          echo "Using simulator: ${DEST}"

      - name: Build
        env:
          SIM_DEST: ${{ steps.sim.outputs.destination }}
        run: |
          xcodebuild build-for-testing \
            -scheme Resonance \
            -destination "${SIM_DEST}" \
            -skipPackagePluginValidation \
            -quiet

      - name: Remove stale result bundle
        run: rm -rf TestResults.xcresult

      - name: Test
        env:
          SIM_DEST: ${{ steps.sim.outputs.destination }}
        run: |
          xcodebuild test \
            -scheme Resonance \
            -destination "${SIM_DEST}" \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults.xcresult \
            -quiet
