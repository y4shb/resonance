name: Swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve simulator destination
        id: sim
        run: |
          # Pick the latest available iPhone simulator runtime and pre-boot it
          INFO=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
              if 'iOS' in runtime:
                  for d in data['devices'][runtime]:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=${INFO}" >> "${GITHUB_OUTPUT}"
          echo "destination=platform=iOS Simulator,id=${INFO}" >> "${GITHUB_OUTPUT}"
          echo "Using simulator UDID: ${INFO}"

      - name: Boot simulator
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "${SIM_UDID}" 2>/dev/null || true
          # Wait until the simulator is fully booted
          xcrun simctl bootstatus "${SIM_UDID}" -b

      - name: Build for testing
        env:
          SIM_DEST: ${{ steps.sim.outputs.destination }}
        run: |
          xcodebuild build-for-testing \
            -scheme Resonance \
            -destination "${SIM_DEST}" \
            -skipPackagePluginValidation \
            -quiet

      - name: Remove stale result bundle
        run: rm -rf TestResults.xcresult

      - name: Test (without rebuilding)
        env:
          SIM_DEST: ${{ steps.sim.outputs.destination }}
        run: |
          xcodebuild test-without-building \
            -scheme Resonance \
            -destination "${SIM_DEST}" \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults.xcresult \
            -quiet
